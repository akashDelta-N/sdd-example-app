<main class="workspace">
  <ui-card class="tree-panel"><header><h1>Locations</h1><ui-icon-button ariaLabel="Add root location" (clicked)="store.startCreateRoot()">+</ui-icon-button></header><app-location-search [control]="searchControl" [results]="store.suggestions()" (selectResult)="onSearchResult($event)" /><app-location-tree [roots]="store.roots()" [childrenByParent]="store.childrenByParent()" [selectedId]="store.selectedId()" [expandedIds]="store.expandedIds()" (selectLocation)="onSelect($event)" (toggleLocation)="store.toggleExpanded($event)" /></ui-card>
  <ui-card class="map-panel"><app-location-map [markers]="store.markers()" [selectedId]="store.selectedId()" [editing]="store.mode() !== 'view'" [draftCoordinates]="store.draftCoordinates()" (selectMarker)="onSelect($event)" (selectCoordinates)="store.setDraftCoordinates($event.latitude, $event.longitude)" /></ui-card>
  <ui-card class="detail-panel"><app-location-detail [location]="store.selected()" [breadcrumb]="store.breadcrumb()" [mode]="store.mode()" [coordinates]="store.draftCoordinates()" (edit)="store.startEdit()" (addChild)="store.startCreateChild()" (save)="store.saveLocation($event)" (cancel)="store.cancelEdit()" (remove)="store.deleteSelected()" /></ui-card>
</main>
@if (store.error(); as message) { <p class="error" role="alert">{{ message }}</p> }
